name: Generate Daily AI Intelligence Briefing

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run two-stage intelligence pipeline
        run: |
          echo "Stage 1: rule-based collection and candidate recall"
          echo "Stage 2: LLM editorial review and daily synthesis"
          python scripts/main.py

      - name: Commit generated output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ site/timeline-data.js
          if git diff --cached --quiet; then
            echo "No output changes to commit."
          else
            git commit -m "Generate daily AI intelligence briefing"
            git push
          fi
