name: Refresh Model AI Intelligence Briefing

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-model-daily:
    runs-on: ubuntu-latest
    env:
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -s requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Refresh model daily from existing editorial candidate pool
        run: |
          echo "Stage 2 only: reuse existing output/daily.md"
          echo "Skip source collection and rule-based candidate recall"
          python scripts/generate_model_from_daily.py

      - name: Commit refreshed model output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/model-daily.md
          if git diff --cached --quiet; then
            echo "No model output changes to commit."
          else
            git commit -m "Refresh model AI intelligence briefing"
            git push
          fi
