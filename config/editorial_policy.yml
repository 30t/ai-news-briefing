      "RAG, retrieval, vector databases, embeddings and data infrastructure",
      "open-source AI infrastructure, inference, serving, fine-tuning and local model tooling",
      "AI commercialization, pricing, enterprise adoption, API changes and workflow automation",
      "AI compute, GPUs, HBM, advanced packaging, inference hardware and semiconductor supply chain",
      "RISC-V, embedded AI, Edge AI, TinyML, MCU/SoC software stack and on-device inference"
    ],
    "medium_priority": [
      "frontier model releases and benchmark results",
      "AI safety and policy items with direct product or enterprise deployment impact",
      "high-signal technical community tests with clear setup, numbers and limitations",
      "research papers with practical implications for agents, coding, RAG, inference or security"
    ],
    "low_priority": [
      "generic AI opinion pieces without new evidence",
      "pure funding news without product, model or market implication",
      "ordinary dependency bumps or patch releases with no user-visible impact",
      "general DIY electronics projects that are not clearly related to Edge AI or on-device intelligence",
      "event announcements, webinars, sponsorships, newsletters and marketing summaries"
    ]
  },
  "high_score_criteria": [
    "Official major model, product, API or platform launch with clear user impact.",
    "Agent, coding-tool or workflow update that changes how developers or operators work.",
    "AI application platform or open-source infrastructure update with meaningful capability, compatibility, performance or deployment impact.",
    "Benchmark or community test with clear setup, quantitative result and practical implication, while still labeled as community evidence.",
    "Research that defines a useful new benchmark, failure mode, security risk, evaluation method, deployment pattern or applied case for agents, RAG, coding, inference or enterprise AI.",
    "Compute or semiconductor news that directly affects AI training, inference, memory, interconnect, packaging, supply, cost or edge deployment.",
    "Enterprise adoption, pricing, API, customer or commercialization signal that could affect product strategy, sales opportunity or career learning direction."
  ],
  "low_score_criteria": [
    "Keyword-stuffed content with little concrete information gain.",
    "Minor release notes, dependency updates or chore-only GitHub releases.",
    "Pure events, webinars, conference reminders, hiring posts, discounts or giveaways.",
    "Funding rumors without official confirmation or clear product/market implication.",
    "Community claims without enough setup, data, reproducibility or original source.",
    "Generic opinion, roundup, newsletter or podcast content without new facts.",
    "Theory-first research papers that do not provide an applied scenario, practical benchmark, engineering method, production risk, tool impact or actionable workflow implication.",
    "Personal DIY or hobby posts unless they clearly demonstrate Edge AI, TinyML, embedded intelligence or a reusable technical pattern."
  ],
  "content_type_guidance": {
    "major_release": "Usually high score if the change has clear user, developer or market impact.",
    "minor_release": "Score low to medium unless the release fixes an important issue or unlocks a clear workflow improvement.",
    "research": "Score based on practical relevance, benchmark quality, concrete applied scenario, engineering usefulness and limits; downgrade theory-first papers that lack application evidence, and never treat research as productized fact.",
    "benchmark": "Score based on setup clarity, quantitative result, reproducibility and whether it changes deployment decisions.",
    "community_discussion": "Can be useful as an early signal, but confidence should be lower than official sources.",
    "funding_rumor": "Usually low unless it is strongly sourced and changes competitive or commercialization understanding.",
    "business_signal": "Score high only when it affects pricing, customers, API access, go-to-market, enterprise adoption or workflow economics.",
    "tutorial": "Score high only if it teaches a reusable workflow relevant to the system focus.",
    "marketing": "Usually low unless it contains concrete product, pricing, API or customer information.",
    "event": "Usually low unless it contains a concrete announcement or release."
  },
  "decision_policy": {
    "include": "Use when the item clearly deserves to appear in today's briefing because it has information gain, relevance and enough confidence.",
    "maybe": "Use when the item is relevant but either not important enough, not actionable enough, or confidence is limited.",
    "exclude": "Use when the item is mostly noise, too minor, too speculative, off-focus, duplicated, or lacks useful information gain."
