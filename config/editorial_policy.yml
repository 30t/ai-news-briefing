{
  "purpose": "Define how the LLM editorial judge should decide whether a candidate item deserves a place in the daily AI intelligence briefing.",
  "core_principles": [
    "Keywords are recall signals, not value signals.",
    "Source level is a trust baseline, not automatic importance.",
    "The LLM judge must reward real information gain, personal relevance, actionability, and confidence.",
    "Community discussion, rumors, and early research must be clearly downgraded unless they provide strong evidence or a meaningful early signal.",
    "A small official release can be less important than a high-quality community benchmark, but the confidence and risk level must remain different.",
    "Research papers should not dominate the briefing unless they show clear applied value, such as a practical benchmark, production risk, deployable method, tool impact, or concrete workflow implication."
