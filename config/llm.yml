{
  "enabled": true,
  "provider": "deepseek",
  "model": "deepseek-v4-flash",
  "base_url": "https://api.deepseek.com",
  "api_key_env": "LLM_API_KEY",
  "fallback_api_key_env": "DEEPSEEK_API_KEY",
  "max_items_for_llm": 20,
  "timeout_seconds": 30,
  "max_retries": 1,
  "fallback_on_error": true,
  "temperature": 0.2,
  "max_output_tokens": 700,
  "excerpt_input_limit": 1800,
  "fetch_article_text": true,
  "article_fetch_timeout_seconds": 12,
  "article_text_limit": 5000,
  "cost_note": {
    "official_pricing_url": "https://api-docs.deepseek.com/quick_start/pricing-details-usd",
    "input_cache_hit_usd_per_1m_tokens": 0.07,
    "input_cache_miss_usd_per_1m_tokens": 0.27,
    "output_usd_per_1m_tokens": 1.10,
    "estimated_daily_cost_usd": "0.01-0.03",
    "estimated_monthly_cost_usd": "0.3-1.0",
    "estimated_monthly_cost_cny": "2-8"
  }
}
